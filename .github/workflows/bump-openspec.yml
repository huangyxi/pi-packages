name: Bump OpenSpec

# Checks the npm registry for a newer @fission-ai/openspec release, bumps the
# pinned devDependency in packages/pi-openspec, and opens a pull request. The
# bumped package is linted, tested, built, and smoke tested before the PR is
# created so a breaking upstream change fails the run instead of the release.
# Runs twice a day so versions still within pnpm's minimum release age are
# retried the same day.

on:
  schedule:
    - cron: '15 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump @fission-ai/openspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 'latest'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - id: version
        name: Check latest published version
        run: |
          latest=$(npm view @fission-ai/openspec version)
          current=$(node --print "require('./packages/pi-openspec/package.json').devDependencies['@fission-ai/openspec']")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump dependency and lockfile
        if: steps.version.outputs.bump == 'true'
        env:
          LATEST_VERSION: ${{ steps.version.outputs.latest }}
        run: |
          node --input-type=module --eval "const { readFileSync, writeFileSync } = await import('node:fs'); const file = 'packages/pi-openspec/package.json'; const manifest = JSON.parse(readFileSync(file, 'utf8')); manifest.devDependencies['@fission-ai/openspec'] = process.env.LATEST_VERSION; writeFileSync(file, JSON.stringify(manifest, null, '\t') + '\n');"
          pnpm install
      - name: Check bumped package
        if: steps.version.outputs.bump == 'true'
        run: |
          pnpm --filter @hyxi/pi-openspec run check
          pnpm --filter @hyxi/pi-openspec run build
          pnpm --filter @hyxi/pi-openspec run smoke
      - name: Open pull request
        if: steps.version.outputs.bump == 'true'
        run: |
          branch="chore/bump-openspec-${{ steps.version.outputs.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packages/pi-openspec/package.json pnpm-lock.yaml
          git commit -m "chore(deps): bump @fission-ai/openspec to ${{ steps.version.outputs.latest }}"
          git push -u origin "$branch"
          gh pr create \
            --title "chore(deps): bump @fission-ai/openspec to ${{ steps.version.outputs.latest }}" \
            --body "Regenerates the pi-openspec skills and /opsx-* prompts against the new OpenSpec release. The bumped dependency is verified by this workflow's check, build, and smoke steps before merge." \
            --label dependencies
