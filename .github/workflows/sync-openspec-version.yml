name: Sync OpenSpec Version

# Keeps the pi-openspec package version in step with the pinned
# @fission-ai/openspec dependency. The sync runs only when that dependency
# version changes, then opens a pull request for the matching package version.

on:
  push:
    branches:
      - main
    paths:
      - packages/pi-openspec/package.json
  schedule:
    - cron: '0 0 * * *' # Run daily at 00:00 UTC.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    name: Detect OpenSpec version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      openspec: ${{ steps.version.outputs.openspec }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        name: Compare dependency versions
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node packages/pi-openspec/scripts/sync-openspec-version.ts detect

  sync:
    name: Sync pi-openspec version
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 'latest'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - id: package
        name: Update package version
        run: node packages/pi-openspec/scripts/sync-openspec-version.ts sync "${{ needs.detect.outputs.openspec }}"
      - name: Install dependencies
        if: steps.package.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Check package
        if: steps.package.outputs.changed == 'true'
        run: |
          pnpm --filter @hyxi/pi-openspec run check
          pnpm --filter @hyxi/pi-openspec run build
          pnpm --filter @hyxi/pi-openspec run smoke
      - name: Open pull request
        if: steps.package.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(release): bump pi-openspec to ${{ needs.detect.outputs.openspec }}'
          branch: 'pi-openspec/chore-sync-version-${{ needs.detect.outputs.openspec }}'
          delete-branch: true
          title: 'chore(release): bump pi-openspec to ${{ needs.detect.outputs.openspec }}'
          body: 'Syncs the package version with the pinned @fission-ai/openspec dependency.'
          labels: dependencies
