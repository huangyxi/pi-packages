name: Sync OpenSpec Version

# Keeps the pi-openspec package version in step with the pinned
# @fission-ai/openspec dependency. The sync runs only when that dependency
# version changes, then opens a pull request for the matching package version.

on:
  push:
    branches:
      - main
    paths:
      - packages/pi-openspec/package.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    name: Detect OpenSpec version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      openspec: ${{ steps.version.outputs.openspec }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        name: Compare dependency versions
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node packages/pi-openspec/scripts/sync-openspec-version.ts detect

  sync:
    name: Sync pi-openspec version
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 'latest'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - id: package
        name: Update package version
        run: node packages/pi-openspec/scripts/sync-openspec-version.ts sync "${{ needs.detect.outputs.openspec }}"
      - name: Install dependencies
        if: steps.package.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Check package
        if: steps.package.outputs.changed == 'true'
        run: |
          pnpm --filter @hyxi/pi-openspec run check
          pnpm --filter @hyxi/pi-openspec run build
          pnpm --filter @hyxi/pi-openspec run smoke
      - name: Open pull request
        if: steps.package.outputs.changed == 'true'
        env:
          OPENSPEC_VERSION: ${{ needs.detect.outputs.openspec }}
        run: |
          branch="pi-openspec/chore-sync-version-$OPENSPEC_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add packages/pi-openspec/package.json
          git commit -m "chore(release): bump pi-openspec to $OPENSPEC_VERSION"
          git push -u origin "$branch"
          gh pr create \
            --title "chore(release): bump pi-openspec to $OPENSPEC_VERSION" \
            --body "Syncs the package version with the pinned @fission-ai/openspec dependency." \
            --label dependencies
